name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff>=0.8.0

      - name: Ruff check (lint)
        run: ruff check agentic_orchestrator/ tests/

      - name: Ruff format check
        run: ruff format --check agentic_orchestrator/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_SECRET_KEY: test-secret-key
          PII_HASH_SALT: test-salt
        run: |
          python -m pytest tests/ -v --tb=short --cov=agentic_orchestrator --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Check for secrets in code
        run: |
          # Fail if .env is committed
          if [ -f .env ]; then
            echo "ERROR: .env file should not be committed!"
            exit 1
          fi

      - name: Bandit security scan
        run: bandit -r agentic_orchestrator/ -x agentic_orchestrator/__pycache__ -ll

  build:
    name: Build & Verify
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API starts
        env:
          ANTHROPIC_API_KEY: sk-ant-test-dummy-key
          API_SECRET_KEY: test-secret-key
          PII_HASH_SALT: test-salt
        run: |
          uvicorn agentic_orchestrator.api:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          # Retry health check — ChromaDB may download ONNX model on first run
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "✅ API health check passed (attempt $i)"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            echo "Waiting for API... (attempt $i/15)"
            sleep 2
          done
          echo "❌ API failed to start within 30s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

      - name: Pipeline passed
        run: echo "✅ All CI checks passed — ready to merge"

